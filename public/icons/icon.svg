<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#F6F0E5" />
      <stop offset="60%" stop-color="#E7DDCA" />
      <stop offset="100%" stop-color="#D0C2A8" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CF9E65" />
      <stop offset="50%" stop-color="#B68B58" />
      <stop offset="100%" stop-color="#735943" />
    </linearGradient>
    <linearGradient id="sageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9BB29D" />
      <stop offset="50%" stop-color="#78927A" />
      <stop offset="100%" stop-color="#496354" />
    </linearGradient>
    <filter id="cozyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Outer Vintage Ornate Ring -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#ringGrad)" stroke-width="8" stroke-dasharray="10 8" />
  <circle cx="256" cy="256" r="202" fill="none" stroke="#78927A" stroke-width="3" opacity="0.6" />

  <!-- Central Companion Body (Whimsical Forest Spirit / Cozy Mascot) -->
  <!-- Shadow -->
  <ellipse cx="256" cy="380" rx="90" ry="24" fill="#735943" opacity="0.18" />

  <!-- Body -->
  <path d="M 170 340 C 160 250, 180 190, 256 180 C 332 190, 352 250, 342 340 C 330 380, 182 380, 170 340 Z" fill="url(#sageGrad)" />
  
  <!-- Soft belly glow -->
  <ellipse cx="256" cy="295" rx="54" ry="58" fill="#F6F0E5" opacity="0.9" />

  <!-- Warm Little Sprout / Leaf on head -->
  <path d="M 256 180 C 256 140, 290 120, 296 110 C 298 135, 275 160, 256 180 Z" fill="#CF9E65" />
  <path d="M 256 180 C 250 145, 225 130, 218 122 C 220 145, 240 165, 256 180 Z" fill="#9BB29D" />

  <!-- Cute Eyes -->
  <ellipse cx="236" cy="265" rx="7" ry="11" fill="#35483D" />
  <circle cx="234" cy="261" r="3.5" fill="#FFFFFF" />
  
  <ellipse cx="276" cy="265" rx="7" ry="11" fill="#35483D" />
  <circle cx="274" cy="261" r="3.5" fill="#FFFFFF" />

  <!-- Cheeks -->
  <ellipse cx="220" cy="280" rx="10" ry="6" fill="#D48C9A" opacity="0.65" />
  <ellipse cx="292" cy="280" rx="10" ry="6" fill="#D48C9A" opacity="0.65" />

  <!-- Cute smile -->
  <path d="M 250 280 Q 256 286 262 280" fill="none" stroke="#496354" stroke-width="3" stroke-linecap="round" />

  <!-- Magical Floating Sparkles (Antique Gold) -->
  <!-- Sparkle 1 Top Right -->
  <path d="M 360 170 Q 375 170 375 155 Q 375 170 390 170 Q 375 170 375 185 Q 375 170 360 170 Z" fill="#CF9E65" filter="url(#cozyGlow)" />
  <!-- Sparkle 2 Top Left -->
  <path d="M 125 210 Q 138 210 138 197 Q 138 210 151 210 Q 138 210 138 223 Q 138 210 125 210 Z" fill="#CF9E65" opacity="0.85" />
  <!-- Sparkle 3 Tiny -->
  <circle cx="340" cy="225" r="5" fill="#E5C378" />
  <circle cx="165" cy="165" r="4" fill="#E5C378" />

  <!-- Vintage Open Book at Base -->
  <path d="M 200 405 Q 256 395 256 410 Q 256 395 312 405 L 316 418 Q 256 408 256 422 Q 256 408 196 418 Z" fill="#B68B58" />
  <path d="M 203 403 Q 256 393 256 407 Q 256 393 309 403 L 307 398 Q 256 388 256 402 Q 256 388 205 398 Z" fill="#F6F0E5" />
</svg>
